<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root{color-scheme:light dark;font-family:var(--font-sans,Inter,ui-sans-serif,system-ui);--bg:var(--color-background-primary,#071a18);--panel:var(--color-background-secondary,#0d2b26);--text:var(--color-text-primary,#edfff8);--muted:var(--color-text-secondary,#9ac2b5);--line:var(--color-border-primary,#295148);--green:#4de3a5;--amber:#ffca61;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{padding:18px;max-width:860px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:750;letter-spacing:.02em}.brand span{color:var(--green)}.stamp{font-size:12px;color:var(--muted)}.hero{margin-top:14px;display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);background:linear-gradient(140deg,var(--panel),color-mix(in srgb,var(--panel),#000 20%));border-radius:18px}.gauge{--score:10;--risk:var(--green);width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--risk) calc(var(--score)*1%),#24443c 0);display:grid;place-items:center;position:relative}.gauge:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}.gauge strong,.gauge small{position:relative;z-index:1}.gauge strong{font-size:30px}.gauge small{font-size:11px;color:var(--muted);margin-top:38px;position:absolute}.severity{text-transform:uppercase;font-size:12px;letter-spacing:.15em;color:var(--risk,var(--green));font-weight:700}.summary{font-size:18px;line-height:1.4;margin:7px 0}.coords{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.metric,.risk,.event,.chart{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:12px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:20px;margin-top:5px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:18px 2px 8px}.risk{margin-bottom:8px;border-left:4px solid var(--risk-color,var(--amber))}.risk h3{font-size:14px;margin:0 0 5px}.risk p,.event p{font-size:12px;color:var(--muted);margin:3px 0;line-height:1.45}.bars{height:95px;display:flex;align-items:end;gap:4px;padding-top:10px}.bar{flex:1;min-width:4px;background:linear-gradient(var(--green),#19775a);border-radius:5px 5px 2px 2px;position:relative}.bar:hover:after{content:attr(data-label);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:#000;color:#fff;padding:3px 5px;border-radius:4px;z-index:2}.events{display:grid;gap:8px}.empty{color:var(--muted);font-size:13px;padding:12px 2px}.sources{font-size:11px;color:var(--muted);margin-top:14px}.loading{min-height:220px;display:grid;place-items:center;color:var(--muted)}@media(max-width:600px){.hero{grid-template-columns:1fr}.gauge{margin:auto}.metrics{grid-template-columns:repeat(2,1fr)}}
    </style>
  </head>
  <body><main id="app"><div class="loading">Waiting for environmental data…</div></main><script>/*__WIDGET_JS__*/</script></body>
</html>
