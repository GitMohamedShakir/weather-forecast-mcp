<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root{font-family:var(--font-sans,Inter,ui-sans-serif,system-ui);color-scheme:light dark;--ink:#f4fbff;--muted:#b9c9dc;--panel:rgba(10,25,47,.52);--line:rgba(208,233,255,.16);--accent:#7de9ff;--good:#4be3a4;--amber:#ffcf67;--danger:#ff6d7a;--sky-a:#153c7b;--sky-b:#501c69;--glow:rgba(113,221,255,.3)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#102a56}body{color:var(--ink)}button{font:inherit;color:inherit}main{position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:560px;padding:20px;background:radial-gradient(circle at 75% 5%,var(--glow),transparent 30%),linear-gradient(135deg,var(--sky-a),var(--sky-b));transition:background .7s ease}.ambient{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.orb{position:absolute;width:260px;height:260px;right:-80px;top:-105px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff8c4 0 5%,#ffc65c 37%,#f48732 70%);box-shadow:0 0 70px 15px rgba(255,200,80,.35);animation:float 7s ease-in-out infinite}.cloud{position:absolute;width:150px;height:38px;border-radius:40px;background:rgba(244,251,255,.25);filter:blur(.3px);animation:drift 18s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:70px;height:70px;left:22px;bottom:0}.cloud:after{width:50px;height:50px;left:77px;bottom:0}.cloud.one{left:-40px;top:112px}.cloud.two{left:38%;top:60px;opacity:.55;animation-delay:-9s}.rain{display:none;position:absolute;inset:0;background-image:linear-gradient(105deg,transparent 46%,rgba(206,242,255,.75) 47% 49%,transparent 50%);background-size:28px 28px;opacity:.55;animation:rain .65s linear infinite}.storm .rain,.rainy .rain{display:block}.storm .orb{background:radial-gradient(circle,#dbe4f3,#7887a4 60%,#314263);box-shadow:0 0 60px rgba(210,224,255,.2)}.rainy .orb{opacity:.55}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:13px;font-weight:850;letter-spacing:.18em}.brand b{color:var(--accent)}.stamp{font-size:12px;color:var(--muted)}.decision{margin-top:14px;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 15px;border:1px solid rgba(125,233,255,.35);border-radius:15px;background:rgba(4,19,43,.45);backdrop-filter:blur(12px)}.decision strong{display:block;font-size:15px}.decision span{display:block;margin-top:3px;font-size:12px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.control{cursor:pointer;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);padding:7px 10px;font-size:11px;font-weight:700;transition:.2s}.control:hover,.control.active{border-color:var(--accent);background:rgba(125,233,255,.17);color:var(--accent)}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:14px}.now,.score,.chart-card,.insights,.event{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 15px 40px rgba(0,0,0,.16)}.now{padding:22px;border-radius:18px;min-height:205px;position:relative}.eyebrow,.section-title{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:750}.temperature{font-size:70px;font-weight:750;letter-spacing:-.08em;line-height:.95;margin:16px 0 10px}.temperature span{font-size:24px;vertical-align:top;letter-spacing:0}.condition{font-size:18px;font-weight:650}.subline{margin-top:6px;color:var(--muted);font-size:13px}.selected-time{margin-top:18px;font-size:12px;color:var(--accent);opacity:0;transform:translateY(4px);transition:.25s}.selected-time.show{opacity:1;transform:none}.score{border-radius:18px;padding:17px;display:flex;flex-direction:column;justify-content:space-between}.dial{--score:10;--risk:var(--good);margin:auto;width:126px;height:126px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--risk) calc(var(--score)*1%),rgba(239,249,255,.16) 0);animation:enter .7s cubic-bezier(.2,.9,.2,1)}.dial:after{content:"";position:absolute;width:102px;height:102px;border-radius:50%;background:#17355b;box-shadow:inset 0 0 22px rgba(0,0,0,.18)}.dial{position:relative}.dial strong,.dial small{z-index:1}.dial strong{font-size:33px}.dial small{position:absolute;margin-top:47px;font-size:10px;letter-spacing:.09em;color:var(--muted)}.risk-copy{text-align:center;margin-top:9px}.risk-copy strong{display:block;text-transform:capitalize}.risk-copy span{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0 18px}.metric{background:rgba(6,18,36,.25);border:1px solid var(--line);border-radius:12px;padding:11px;transition:transform .2s,background .2s}.metric:hover{transform:translateY(-3px);background:rgba(7,26,49,.52)}.metric label{display:block;font-size:10px;color:var(--muted)}.metric strong{display:block;margin-top:5px;font-size:18px}.chart-card{border-radius:18px;padding:16px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.legend{color:var(--muted);font-size:11px}.forecast-scroll{overflow-x:auto;margin-top:14px;padding-bottom:5px}.hour-strip{display:grid;grid-template-columns:repeat(24,minmax(58px,1fr));gap:7px;min-width:1500px}.hour{appearance:none;text-align:center;border:1px solid transparent;background:rgba(255,255,255,.05);border-radius:12px;padding:9px 5px;cursor:pointer;transition:.2s}.hour:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}.hour.active{border-color:var(--accent);background:rgba(125,233,255,.15);box-shadow:0 0 0 1px rgba(125,233,255,.12)}.hour .time{font-size:10px;color:var(--muted)}.weather-icon{height:24px;margin:7px auto;font-size:20px;line-height:1}.hour .temp{font-size:15px;font-weight:700}.hour .rainbar{height:32px;display:flex;align-items:end;justify-content:center;margin-top:8px}.hour .rainbar i{display:block;width:7px;max-height:30px;border-radius:6px 6px 2px 2px;background:linear-gradient(#9beeff,#2375d4);animation:grow .55s both}.graph-wrap{position:relative;height:108px;margin:10px 0 2px}.temp-line{width:100%;height:100%;overflow:visible}.temp-line path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(125,233,255,.5));stroke-dasharray:460;stroke-dashoffset:460;animation:draw 1.1s ease forwards}.temp-line .area{fill:url(#areaGradient);stroke:none;opacity:.5;animation:none}.point{fill:#fff;stroke:var(--accent);stroke-width:3;cursor:pointer;transition:r .15s}.point:hover,.point.active{r:6}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.lower{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:14px}.insights{border-radius:18px;padding:15px}.risk{padding:10px 11px;margin-top:8px;border-left:3px solid var(--risk);background:rgba(3,15,33,.25);border-radius:7px}.risk h3{font-size:13px;margin:0 0 4px}.risk p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.events{display:grid;gap:8px;margin-top:9px}.event{border-radius:12px;padding:10px}.event strong{font-size:12px}.event p{font-size:11px;line-height:1.45;color:var(--muted);margin:4px 0 0}.sources{margin:14px 2px 0;font-size:11px;color:var(--muted)}.empty{color:var(--muted);font-size:13px;padding:12px 2px}.loading{min-height:260px;display:grid;place-items:center;color:var(--muted)}@keyframes float{50%{transform:translate(-12px,12px) scale(1.04)}}@keyframes drift{to{transform:translateX(calc(100vw + 250px))}}@keyframes rain{to{background-position:-30px 30px}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}@keyframes enter{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:680px){main{padding:14px}.decision{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}.hero,.lower{grid-template-columns:1fr}.score{min-height:210px}.metrics{grid-template-columns:repeat(2,1fr)}.temperature{font-size:60px}}
    </style>
  </head>
  <body><main id="app"><div class="loading">Building your environmental forecast…</div></main><script>/*__WIDGET_JS__*/</script></body>
</html>
